# AppImage Builder 配置文件
# 用于构建 JimBDHub 的 AppImage 包

version: 1

script:
  # 创建 AppDir 结构
  - rm -rf $TARGET_APPDIR || true
  - mkdir -p $TARGET_APPDIR/usr/share/jimbdhub
  - mkdir -p $TARGET_APPDIR/usr/bin
  - mkdir -p $TARGET_APPDIR/usr/share/applications
  - mkdir -p $TARGET_APPDIR/usr/share/icons/hicolor/256x256/apps
  - mkdir -p $TARGET_APPDIR/usr/share/pixmaps

  # 复制程序文件
  - cp -r $SOURCE_DIR/desktop $TARGET_APPDIR/usr/share/jimbdhub/
  - cp -r $SOURCE_DIR/assets $TARGET_APPDIR/usr/share/jimbdhub/
  - cp -r $SOURCE_DIR/web $TARGET_APPDIR/usr/share/jimbdhub/

  # 清理不应打进 AppImage 的开发用虚拟环境（本地构建时可能存在）
  - rm -rf $TARGET_APPDIR/usr/share/jimbdhub/desktop/venv $TARGET_APPDIR/usr/share/jimbdhub/desktop/venv-wine $TARGET_APPDIR/usr/share/jimbdhub/desktop/venv-wsl $TARGET_APPDIR/usr/share/jimbdhub/desktop/__pycache__ || true

  # 安装 Python 依赖到固定目录。
  # 注意：这里不能用 `pip install --prefix=$TARGET_APPDIR/usr`，因为 Debian/Ubuntu
  # 的默认安装方案是 posix_local，会装到 usr/local/lib/pythonX.Y/dist-packages，
  # 导致 AppImage 在官方测试环境（Ubuntu/Debian）里找不到 webview 模块。
  # pip 不受 PEP 668 限制地装到固定目录（仅影响 AppDir，不污染系统 Python）
  - python3 -m pip install --target=$TARGET_APPDIR/usr/lib/jimbdhub-python --upgrade --ignore-installed --no-warn-script-location -r $SOURCE_DIR/desktop/requirements.txt || python3 -m pip install --target=$TARGET_APPDIR/usr/lib/jimbdhub-python --upgrade --ignore-installed --no-warn-script-location --break-system-packages -r $SOURCE_DIR/desktop/requirements.txt
  - find $TARGET_APPDIR/usr/lib/jimbdhub-python -name QtWebEngineProcess -exec chmod +x {} \; || true

  # 打包 Qt xcb 平台插件所需的 X11 运行库（原因详见 Build.sh 中的同名段落）。
  # 不随包会报 "Could not load the Qt platform plugin \"xcb\"" 并启动即退出。
  # 注意：本构建器基于 Ubuntu jammy，可能没有 libxcb-cursor0（Qt 6.5+ 需要），
  # 若需完整的 xcb 支持，请优先使用 Build.sh 构建。
  - |
    set -e
    QT_X11_LIBS=$TARGET_APPDIR/usr/lib/qt-x11
    rm -rf "$QT_X11_LIBS"
    mkdir -p "$QT_X11_LIBS"
    for lib in libxkbcommon-x11.so.0 libxkbcommon.so.0 libxcb-cursor.so.0 \
               libxcb-icccm.so.4 libxcb-image.so.0 libxcb-keysyms.so.1 \
               libxcb-randr.so.0 libxcb-render-util.so.0 libxcb-shape.so.0 \
               libxcb-sync.so.1 libxcb-xfixes.so.0 libxcb-xinerama.so.0 \
               libxcb-xkb.so.1 libxcb-util.so.1 libxcb-shm.so.0 \
               libxcb-render.so.0 libxcb-glx.so.0 libxcb.so.1 \
               libX11-xcb.so.1 libX11.so.6 libXau.so.6 libXdmcp.so.6 \
               libxshmfence.so.1; do
      src=$(ldconfig -p 2>/dev/null | awk -v n="$lib" '$1 == n { print $NF; exit }')
      if [ -n "$src" ] && [ -f "$src" ]; then cp -Lf "$src" "$QT_X11_LIBS/" || true; fi
    done
    QXCB_PLUGIN=$TARGET_APPDIR/usr/lib/jimbdhub-python/PyQt6/Qt6/plugins/platforms/libqxcb.so
    if [ -f "$QXCB_PLUGIN" ]; then
      ldd "$QXCB_PLUGIN" 2>/dev/null | sed -n 's/.*=> \(.*\.so[^ ]*\).*/\1/p' | while read -r p; do
        case "$(basename "$p")" in
          libX11*|libxcb*|libXau*|libXdmcp*|libxkbcommon*|libxshmfence*)
            if [ -f "$p" ]; then cp -Lf "$p" "$QT_X11_LIBS/" || true; fi ;;
        esac
      done
    fi

  # 复制图标
  - cp $SOURCE_DIR/assets/JimBDHubIcon256.png $TARGET_APPDIR/usr/share/icons/hicolor/256x256/apps/JimBDHubIcon256.png
  - cp $SOURCE_DIR/assets/JimBDHubIcon256.png $TARGET_APPDIR/usr/share/pixmaps/JimBDHubIcon256.png

  # 创建启动脚本（位于 usr/bin，向上两级才是 AppDir 根目录）
  - |
    cat > $TARGET_APPDIR/usr/bin/jimbdhub << 'EOF'
    #!/bin/bash
    # JimBDHub AppImage 启动脚本

    HERE="$(dirname "$(readlink -f "${0}")")"
    APPDIR="$(dirname "$(dirname "$HERE")")"

    # 强制使用 PyQt6
    export QT_API=pyqt6

    # 打包依赖目录（固定路径，与宿主 Python 版本 / 发行版安装方案无关）
    SITE_PACKAGES="$APPDIR/usr/lib/jimbdhub-python"
    export PYTHONPATH="$SITE_PACKAGES:$APPDIR/usr/share/jimbdhub:$PYTHONPATH"

    # xcb 平台插件所需的 X11 运行库（随包分发，保证在精简环境 / firejail 里也能加载）
    export LD_LIBRARY_PATH="$APPDIR/usr/lib/qt-x11:$LD_LIBRARY_PATH"

    # AppImage 内只打包了 PyQt6（没有 GTK），明确指定 pywebview 使用 Qt 后端
    export PYWEBVIEW_GUI=qt

    # QtWebEngineProcess / 资源 / 翻译 / 插件路径
    if [ -x "$SITE_PACKAGES/PyQt6/Qt6/libexec/QtWebEngineProcess" ]; then
        export QTWEBENGINEPROCESS_PATH="$SITE_PACKAGES/PyQt6/Qt6/libexec/QtWebEngineProcess"
    fi
    export QTWEBENGINE_RESOURCES_PATH="$SITE_PACKAGES/PyQt6/Qt6/resources"
    export QTWEBENGINE_LOCALES_PATH="$SITE_PACKAGES/PyQt6/Qt6/translations/qtwebengine_locales"
    export QT_PLUGIN_PATH="$SITE_PACKAGES/PyQt6/Qt6/plugins:$QT_PLUGIN_PATH"
    export QML2_IMPORT_PATH="$SITE_PACKAGES/PyQt6/Qt6/qml:$QML2_IMPORT_PATH"

    # AppImage / firejail / root 环境下 Chromium 沙箱通常不可用，关闭沙箱并走软件渲染
    export QTWEBENGINE_DISABLE_SANDBOX=1
    export QTWEBENGINE_CHROMIUM_FLAGS="${QTWEBENGINE_CHROMIUM_FLAGS:-} --no-sandbox --disable-gpu --disable-dev-shm-usage"

    # 启动程序
    exec python3 "$APPDIR/usr/share/jimbdhub/desktop/main.py" "$@"
    EOF
  - chmod +x $TARGET_APPDIR/usr/bin/jimbdhub

  # 创建桌面文件
  - |
    cat > $TARGET_APPDIR/usr/share/applications/jimbdhub.desktop << 'EOF'
    [Desktop Entry]
    Name=JimBDHub
    Comment=一个给双相情感障碍患者记录情绪变化的软件
    Exec=jimbdhub
    Icon=JimBDHubIcon256
    Terminal=false
    Type=Application
    Categories=Utility
    StartupNotify=true
    EOF

  # 创建 AppRun 脚本
  - |
    cat > $TARGET_APPDIR/AppRun << 'EOF'
    #!/bin/bash
    # AppImage 入口点

    # 获取 AppDir 路径
    SELF=$(readlink -f "$0")
    HERE=${SELF%/*}

    # 强制使用 PyQt6
    export QT_API=pyqt6

    #设置环境变量
    export PATH="$HERE/usr/bin:$PATH"

    # 打包依赖目录（固定路径，与宿主 Python 版本 / 发行版安装方案无关）
    SITE_PACKAGES="$HERE/usr/lib/jimbdhub-python"
    export PYTHONPATH="$SITE_PACKAGES:$HERE/usr/share/jimbdhub:$PYTHONPATH"

    # xcb 平台插件所需的 X11 运行库（随包分发，保证在精简环境 / firejail 里也能加载）
    export LD_LIBRARY_PATH="$HERE/usr/lib/qt-x11:$LD_LIBRARY_PATH"

    # AppImage 内只打包了 PyQt6（没有 GTK），明确指定 pywebview 使用 Qt 后端
    export PYWEBVIEW_GUI=qt

    # QtWebEngineProcess / 资源 / 翻译 / 插件路径
    if [ -x "$SITE_PACKAGES/PyQt6/Qt6/libexec/QtWebEngineProcess" ]; then
        export QTWEBENGINEPROCESS_PATH="$SITE_PACKAGES/PyQt6/Qt6/libexec/QtWebEngineProcess"
    fi
    export QTWEBENGINE_RESOURCES_PATH="$SITE_PACKAGES/PyQt6/Qt6/resources"
    export QTWEBENGINE_LOCALES_PATH="$SITE_PACKAGES/PyQt6/Qt6/translations/qtwebengine_locales"
    export QT_PLUGIN_PATH="$SITE_PACKAGES/PyQt6/Qt6/plugins:$QT_PLUGIN_PATH"
    export QML2_IMPORT_PATH="$SITE_PACKAGES/PyQt6/Qt6/qml:$QML2_IMPORT_PATH"

    # AppImage / firejail / root 环境下 Chromium 沙箱通常不可用，关闭沙箱并走软件渲染
    export QTWEBENGINE_DISABLE_SANDBOX=1
    export QTWEBENGINE_CHROMIUM_FLAGS="${QTWEBENGINE_CHROMIUM_FLAGS:-} --no-sandbox --disable-gpu --disable-dev-shm-usage"

    # 启动程序
    exec python3 "$HERE/usr/share/jimbdhub/desktop/main.py" "$@"
    EOF
  - chmod +x $TARGET_APPDIR/AppRun

  # 创建 .desktop 文件到根目录
  - cp $TARGET_APPDIR/usr/share/applications/jimbdhub.desktop $TARGET_APPDIR/jimbdhub.desktop
  - cp $TARGET_APPDIR/usr/share/icons/hicolor/256x256/apps/JimBDHubIcon256.png $TARGET_APPDIR/JimBDHubIcon256.png || true

AppDir:
  path: ./AppDir

  app_info:
    id: com.github.jimmy32767255.jimbdhub
    name: JimBDHub
    icon: JimBDHubIcon256
    version: 1.5.0
    exec: usr/bin/jimbdhub
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse'
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse'

    include:
      - python3
      - python3-pip
      # PyQt6 需要通过 pip 安装，不使用系统包

  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

AppImage:
  arch: x86_64
  update-information: guess
  sign-key: None
