<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JimBDHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">~</span>
        <h1 class="brand-title">JimBDHub</h1>
      </div>
      <nav class="nav" aria-label="主导航">
        <a href="#overview" class="nav-link active" data-view="overview">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
          <span>概览</span>
        </a>
        <a href="#meds" class="nav-link" data-view="meds">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="M8.5 8.5l7 7"/></svg>
          <span>药品库</span>
        </a>
        <a href="#records" class="nav-link" data-view="records">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>记录</span>
        </a>
      </nav>
      <div class="sidebar-footer"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h2 class="page-title" id="page-title">概览</h2>
      </header>

      <section class="view view-active" id="overview-view" aria-labelledby="page-title">
        <div class="card chart-card">
          <div class="card-header">
            <h3>情绪波动</h3>
            <div class="chart-legend">
              <span class="legend-item"><i class="dot red"></i>躁狂 / 亢奋</span>
              <span class="legend-item"><i class="dot blue"></i>抑郁 / 低落</span>
              <span class="legend-item"><i class="dot gray"></i>药效区间</span>
            </div>
          </div>
          <div class="chart-toolbar">
            <div class="range-tabs">
              <button class="range-tab active" data-range="week">近一周</button>
              <button class="range-tab" data-range="month">近一月</button>
              <button class="range-tab" data-range="all">全部</button>
            </div>
          </div>
          <div class="chart-wrap" id="chart-wrap">
            <svg id="mood-chart" preserveAspectRatio="none"></svg>
            <div class="chart-tooltip" id="chart-tooltip" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="view" id="meds-view" aria-labelledby="page-title">
        <div class="meds-layout">
          <div class="card meds-table-card">
            <div class="card-header">
              <h3>药品库存</h3>
              <button class="btn btn-primary btn-sm" id="add-med-btn">新增药品</button>
            </div>
            <div class="table-wrap">
              <table class="data-table" id="meds-table">
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>分类</th>
                    <th>剩余</th>
                    <th>详细数量</th>
                    <th>备注</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="card logs-card">
            <div class="card-header">
              <h3>变更日志</h3>
            </div>
            <div class="logs-list" id="logs-list"></div>
          </div>
        </div>
      </section>

      <section class="view" id="records-view" aria-labelledby="page-title">
        <div class="records-layout">
          <div class="card record-form-card">
            <div class="card-header">
              <h3 id="record-form-title">新增情绪记录</h3>
            </div>
            <form id="record-form" class="record-form">
              <input type="hidden" id="record-id">
              <div class="form-row">
                <label class="form-field">
                  <span class="form-label">时间</span>
                  <input type="datetime-local" id="record-time" required>
                </label>
              </div>
              <div class="form-row two-col">
                <label class="form-field">
                  <span class="form-label">情绪值 <output id="value-out">0</output></span>
                  <input type="range" id="record-value" min="-10" max="10" step="1" value="0">
                  <span class="range-hint">负值偏抑郁，正值偏躁狂</span>
                </label>
                <label class="form-field checkbox-field">
                  <input type="checkbox" id="record-mixed">
                  <span>混合期（同时存在相反情绪）</span>
                </label>
              </div>
              <div class="form-row" id="mixed-value-row" hidden>
                <label class="form-field">
                  <span class="form-label">混合情绪值 <output id="mixed-value-out">0</output></span>
                  <input type="range" id="record-mixed-value" min="-10" max="10" step="1" value="0">
                </label>
              </div>
              <div class="form-row two-col">
                <label class="form-field checkbox-field">
                  <input type="checkbox" id="record-medication">
                  <span>使用药物</span>
                </label>
                <label class="form-field" id="medication-strength-field" hidden>
                  <span class="form-label">药效强度 <output id="strength-out">5</output></span>
                  <input type="range" id="record-medication-strength" min="0" max="10" step="1" value="5">
                </label>
              </div>
              <div class="form-row">
                <label class="form-field">
                  <span class="form-label">备注</span>
                  <textarea id="record-note" rows="3" placeholder="记录当下的身体感受、睡眠、事件等"></textarea>
                </label>
              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-ghost" id="record-cancel">取消</button>
                <button type="submit" class="btn btn-primary">保存记录</button>
              </div>
            </form>
          </div>
          <div class="card records-list-card">
            <div class="card-header">
              <h3>历史记录</h3>
            </div>
            <div class="records-list" id="records-list"></div>
          </div>
        </div>
      </section>

      <div class="bottom-nav" id="bottom-nav">
        <a href="#overview" class="nav-link active" data-view="overview">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
          <span>概览</span>
        </a>
        <a href="#meds" class="nav-link" data-view="meds">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="M8.5 8.5l7 7"/></svg>
          <span>药品库</span>
        </a>
        <a href="#records" class="nav-link" data-view="records">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>记录</span>
        </a>
      </div>
    </main>
  </div>

  <div class="modal" id="med-modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="med-modal-title">新增药品</h3>
      <form id="med-form">
        <input type="hidden" id="med-id">
        <div class="form-row two-col">
          <label class="form-field"><span class="form-label">名称</span><input type="text" id="med-name" required></label>
          <label class="form-field"><span class="form-label">分类</span><input type="text" id="med-category" placeholder="如：心境稳定剂"></label>
        </div>
        <div class="form-row three-col">
          <label class="form-field"><span class="form-label">盒数</span><input type="number" id="med-box" min="0" value="0" required></label>
          <label class="form-field"><span class="form-label">每盒板/瓶数</span><input type="number" id="med-board" min="0" value="0" required></label>
          <label class="form-field"><span class="form-label">每板/瓶粒数</span><input type="number" id="med-pills" min="0" value="0" required></label>
        </div>
        <div class="form-row two-col">
          <label class="form-field"><span class="form-label">单位</span>
            <select id="med-unit"><option value="粒">粒</option><option value="片">片</option></select>
          </label>
          <label class="form-field"><span class="form-label">当前剩余（总数）</span><input type="number" id="med-remaining" min="0" required></label>
        </div>
        <div class="form-row">
          <label class="form-field"><span class="form-label">备注</span><textarea id="med-note" rows="2"></textarea></label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="med-cancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
