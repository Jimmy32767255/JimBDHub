name: Nightly Build

# 自动夜间构建：dev 分支有变动时编译三端并发布到滚动 Nightly 预发布
on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: nightly-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  windows:
    name: Windows exe (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包 Windows exe
        shell: cmd
        # < NUL 防止 CI 中出错路径上的 pause 挂起
        run: Build.bat < NUL

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Microsoft-Windows-amd64.exe
          if-no-files-found: error

  linux:
    name: GNU/Linux AppImage
    runs-on: ubuntu-latest
    env:
      # 让 appimagetool 以自解压方式运行，避免 CI 上无 FUSE 的问题
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # ubuntu-24.04 的 pip 受 PEP 668 外部管理环境限制
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxcb-cursor0 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2

      - name: 打包 AppImage
        run: ./Build.sh

      # 冒烟测试：在接近 AppImage 官方测试环境（Ubuntu/Debian）的条件下校验打包结果。
      # 历史上出现过 `pip --prefix` 在 Debian 系把依赖装到
      # usr/local/lib/pythonX.Y/dist-packages，而启动脚本却到
      # usr/lib/pythonX.Y/site-packages 里找，导致运行即崩溃
      # （ModuleNotFoundError: No module named 'webview'）的回归。
      - name: AppImage 冒烟测试
        run: |
          set -e
          APPIMAGE=dist/GNU-Linux-amd64.AppImage
          chmod +x "$APPIMAGE"

          # 解压 AppImage（不依赖 FUSE），校验启动脚本引用的依赖目录真实存在
          EXTRACT_DIR=$(mktemp -d)
          ( cd "$EXTRACT_DIR" && "$APPIMAGE" --appimage-extract >/dev/null )
          ROOT="$EXTRACT_DIR/squashfs-root"

          test -d "$ROOT/usr/lib/jimbdhub-python/webview" || {
            echo "::error::AppImage 内缺少 usr/lib/jimbdhub-python/webview，启动脚本 PYTHONPATH 与 pip 安装位置不一致"; exit 1;
          }

          # 用启动脚本声明的同一个 PYTHONPATH 做模块解析检查：直接验证根因是否修复
          PYTHONPATH="$ROOT/usr/lib/jimbdhub-python" python3 - <<'PY'
          import importlib.util as u
          for name in ("webview", "qtpy", "PyQt6.QtCore", "PyQt6.QtWidgets"):
              if u.find_spec(name) is None:
                  raise SystemExit(f"::error::启动脚本的 PYTHONPATH 下找不到模块: {name}")
          print("dependency resolution OK")
          PY

          if [ ! -x "$ROOT/usr/lib/jimbdhub-python/PyQt6/Qt6/libexec/QtWebEngineProcess" ]; then
            echo "::error::QtWebEngineProcess 不存在或不可执行"; exit 1;
          fi

          # 真正启动一次 GUI（xvfb 虚拟显示，模拟 firejail/无沙箱环境），
          # 确认能持续运行而非启动即崩溃。
          # 注意：不能只用 `sleep` + `kill` 了事，否则应用秒崩也会被当成通过。
          sudo apt-get install -y --no-install-recommends xvfb
          cat > /tmp/gui_smoke.sh <<'SH'
          set -u
          APPIMAGE_EXTRACT_AND_RUN=1 "$1" > /tmp/gui_smoke.log 2>&1 &
          APP_PID=$!
          sleep 25
          if kill -0 "$APP_PID" 2>/dev/null; then
              echo "GUI smoke OK: 应用在 25 秒后仍在运行"
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              exit 0
          fi
          wait "$APP_PID" 2>/dev/null
          echo "::error::应用启动后崩溃（firejail/无沙箱环境下常见）"
          echo "---- 应用输出 ----"
          cat /tmp/gui_smoke.log
          exit 1
          SH
          xvfb-run -a --server-args="-screen 0 1280x800x24" bash /tmp/gui_smoke.sh "$APPIMAGE"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/GNU-Linux-amd64.AppImage
          if-no-files-found: error

  android:
    name: Android APK (assembleRelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 SDK 仓库已下线 `tools` 包，setup-android 默认的 "tools platform-tools"
          # 会报 "Failed to find package 'tools'" 并返回退出码 1；这里只装 platform-tools，
          # 其余 platforms / build-tools 由 Gradle 在构建时按需自动下载。
          packages: platform-tools

      # 机密不能在 if 条件中引用，改为脚本内判断；未配齐时自动构建未签名 APK
      - name: 配置签名（机密齐全时）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            # gradle 的 file() 相对模块目录 android/app/ 解析
            echo "KEYSTORE_PATH=keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::签名 机密未配齐，本次将构建未签名 APK"
          fi

      # 在耗时构建前先用 keytool 快速校验签名配置，避免 build 到最后才报密码错误
      - name: 校验签名配置
        if: hashFiles('android/app/keystore.jks') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS=android/app/keystore.jks

          # 1) 校验 store 密码 + 别名是否存在
          echo "==> 校验 store 密码与别名"
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD 或 KEY_ALIAS 校验失败"
            if keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" >/tmp/aliases.txt 2>/dev/null; then
              echo "keystore 实际包含的别名如下（请检查 KEY_ALIAS 是否填写一致）："
              sed -n '1,25p' /tmp/aliases.txt
            else
              echo "KEYSTORE_PASSWORD 无法打开该 keystore。请检查 GitHub Secret 中 KEYSTORE_PASSWORD。"
            fi
            exit 1
          fi

          # 2) 两者相同则无需再校验（PKCS12 / 同密码 JKS 均成立）；
          #    不同时用 keytool -keypasswd 原地改回同密码来验证 key 密码是否正确（CI 每次都会重新解出 keystore，无副作用）
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "==> KEY_PASSWORD 与 KEYSTORE_PASSWORD 不同，额外校验 key 密码"
            if ! keytool -keypasswd -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" >/dev/null 2>&1; then
              echo "::error::KEY_PASSWORD 与该别名的私钥密码不匹配（Get Key failed: Given final block not properly padded）"
              exit 1
            fi
          fi
          echo "::notice::签名配置校验通过，开始构建"

      - name: 构建 release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: 清理签名文件
        if: always()
        run: rm -f android/app/keystore.jks

      - name: 收集并重命名 APK
        run: |
          mkdir -p dist
          # AGP 9 输出到 android/app/release/，广搜 app-release* 兼容签名/未签名命名
          find android/app -name "app-release*.apk" -exec cp {} dist/Google-Android-arm64.apk \;
          ls -la dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/Google-Android-arm64.apk
          if-no-files-found: error

  release:
    name: 发布到 Nightly 预发布
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成构建信息
        id: info
        run: |
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "build_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 将 Nightly 标签 指向最新 dev 提交
        run: |
          git tag -f Nightly "${GITHUB_SHA}"
          git push origin --force refs/tags/Nightly

      - name: 下载三端产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 生成更新元数据 Metadata.json：软件内"检查更新"会拉取该文件，
      # 依据频道（channel）与运行环境（os/arch）找到对应的下载链接与 SHA-512 校验码
      # （客户端使用 SHA-512；SHA-256、SHA-1、MD5 供第三方校验）。
      # 版本号 = 前端 about.js 中的 APP_VERSION + 构建日期后缀，保证每个夜间构建都可被识别为更新。
      - name: 生成更新元数据 Metadata.json
        env:
          BUILD_DATE: ${{ steps.info.outputs.build_date }}
        run: |
          set -e
          APP_VERSION=$(grep -oP "APP_VERSION = '[^']+'" web/js/about.js | head -1 | sed "s/.*'\([^']*\)'.*/\1/" || true)
          if [ -z "$APP_VERSION" ]; then APP_VERSION="V0.0.0"; fi
          export UPDATE_VERSION="${APP_VERSION}-N$(date -u +'%Y%m%d')"
          python3 - <<'PYEOF'
          import hashlib, json, os
          targets = [
              ("Microsoft-Windows-amd64.exe", "windows", "amd64"),
              ("GNU-Linux-amd64.AppImage", "linux", "amd64"),
              ("Google-Android-arm64.apk", "android", "arm64"),
          ]
          def compute_hashes(path):
              hashers = {
                  "sha512": hashlib.sha512(),
                  "sha256": hashlib.sha256(),
                  "sha1": hashlib.sha1(),
                  "md5": hashlib.md5(),
              }
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      for h in hashers.values():
                          h.update(chunk)
              return {k: v.hexdigest() for k, v in hashers.items()}
          files = []
          for name, os_name, arch in targets:
              path = os.path.join("dist", name)
              if not os.path.exists(path):
                  continue
              hashes = compute_hashes(path)
              files.append({
                  "name": name,
                  "os": os_name,
                  "arch": arch,
                  "url": "https://github.com/Jimmy32767255/JimBDHub/releases/download/Nightly/%s" % name,
                  **hashes,
              })
          meta = {
              "version": os.environ["UPDATE_VERSION"],
              "tag": "Nightly",
              "channel": "N",
              "name": "自动夜间构建（Nightly Build）",
              "published_at": os.environ.get("BUILD_DATE", ""),
              "files": files,
          }
          with open("dist/Metadata.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          PYEOF
          echo "Metadata.json 已生成："
          cat dist/Metadata.json

      - name: 创建/更新 Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nightly
          name: 自动夜间构建（Nightly Build）
          body: |
            # 自动夜间构建（Nightly Build）

            - 分支：`dev`
            - 提交：`${{ steps.info.outputs.build_sha }}`
            - 构建时间：${{ steps.info.outputs.build_date }}

            该版本由 CI 自动构建，未经过完整测试，可能不稳定，仅供体验与反馈。正式版请在 Releases 页查找非预发布版本。

          prerelease: true
          files: |
            dist/Microsoft-Windows-amd64.exe
            dist/GNU-Linux-amd64.AppImage
            dist/Google-Android-arm64.apk
            dist/Metadata.json
